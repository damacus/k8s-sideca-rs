name: publish image

# Called from release-please.yml after a release is cut (releases created by
# GITHUB_TOKEN do not fire `release: published` workflows), and runnable by
# hand to republish an existing tag.
#
# Per-arch jobs run on native runners (ubuntu-24.04-arm for arm64 — QEMU
# emulation of a full Rust build takes ~an hour); a merge job assembles the
# multi-arch manifest, SBOMs and provenance.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: Git tag to build (e.g. v0.1.0)
      version:
        required: true
        type: string
        description: Bare semver (e.g. 0.1.0)
      major:
        required: true
        type: string
      minor:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: Git tag to build (e.g. v0.1.0)
      version:
        required: true
        type: string
        description: Bare semver (e.g. 0.1.0)
      major:
        required: true
        type: string
      minor:
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push a per-arch tag; the merge job stitches the multi-arch manifest.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}-${{ matrix.arch }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for tag in "${{ inputs.version }}" "${{ inputs.major }}.${{ inputs.minor }}" "${{ inputs.major }}" "sha-${{ github.sha }}"; do
            docker buildx imagetools create -t "${{ env.IMAGE }}:${tag}" \
              "${{ env.IMAGE }}:${{ inputs.version }}-amd64" \
              "${{ env.IMAGE }}:${{ inputs.version }}-arm64"
          done
          digest=$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ inputs.version }}" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@v3
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

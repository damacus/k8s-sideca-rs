name: publish image

# Called from release-please.yml after a release is cut (releases created by
# GITHUB_TOKEN do not fire `release: published` workflows), and runnable by
# hand to republish an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: Git tag to build (e.g. v0.1.0)
      version:
        required: true
        type: string
        description: Bare semver (e.g. 0.1.0)
      major:
        required: true
        type: string
      minor:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: Git tag to build (e.g. v0.1.0)
      version:
        required: true
        type: string
        description: Bare semver (e.g. 0.1.0)
      major:
        required: true
        type: string
      minor:
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ inputs.major }}.${{ inputs.minor }}
            type=raw,value=${{ inputs.major }}
            type=sha

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable digest
        run: echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@v3
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

name: beta image

# Builds a testable image from every open release-please PR — the "would-be
# release" content — so a pending release can be canaried before it merges.
# Tags: `beta` (rolling), `<version>-beta` (from the release manifest) and
# `sha-<sha>` (exact). Beta builds skip SBOM/provenance; they are not release
# artifacts.
#
# release-please PRs are opened with GITHUB_TOKEN, whose events cannot trigger
# other workflows — so `pull_request` alone never fires for them. The
# `workflow_run` trigger resolves the open release-please PR after each
# release-please run instead. `pull_request` still covers preview branches
# opened by users/apps, and `workflow_dispatch` allows ad-hoc builds of any ref.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [release-please]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: Branch, tag or SHA to build (defaults to this branch)

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: beta-image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prep:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tags: ${{ steps.tags.outputs.tags }}
      arch_tag: ${{ steps.tags.outputs.arch_tag }}
    steps:
      - name: Resolve target SHA
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
          DISPATCH_REF: ${{ inputs.ref || '' }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              sha="$PR_HEAD"
              ;;
            workflow_run)
              sha=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                --json headRefName,headRefOid \
                --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefOid // empty')
              ;;
            *)
              ref="${DISPATCH_REF:-$WORKFLOW_SHA}"
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)
              ;;
          esac
          if [[ -n "$sha" ]]; then
            echo "target: $sha"
          else
            echo "no open release-please PR; nothing to build"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.target.outputs.sha != ''
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Resolve beta tags
        id: tags
        if: steps.target.outputs.sha != ''
        env:
          EVENT: ${{ github.event_name }}
        run: |
          short=$(git rev-parse --short=8 HEAD)
          echo "arch_tag=${IMAGE}:sha-${short}" >> "$GITHUB_OUTPUT"
          tags="beta sha-${short}"
          if [[ "$EVENT" == "pull_request" || "$EVENT" == "workflow_run" ]]; then
            ver=$(jq -r '.["."] // empty' .release-please-manifest.json)
            [[ -n "$ver" ]] && tags="${ver}-beta ${tags}"
          fi
          echo "beta tags: $tags"
          {
            echo "tags<<EOF"
            for t in $tags; do echo "${IMAGE}:${t}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    if: needs.prep.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.prep.outputs.arch_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ needs.prep.outputs.sha }}
          cache-from: type=gha,scope=beta-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=beta-${{ matrix.arch }}

  merge:
    needs: [prep, build]
    if: needs.prep.outputs.sha != ''
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          ARCH_TAG: ${{ needs.prep.outputs.arch_tag }}
          TAGS: ${{ needs.prep.outputs.tags }}
        run: |
          args=()
          while IFS= read -r t; do
            [[ -n "$t" ]] && args+=(-t "$t")
          done <<< "$TAGS"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.event.repository.html_url }}" \
            "${args[@]}" \
            "$ARCH_TAG-amd64" \
            "$ARCH_TAG-arm64"

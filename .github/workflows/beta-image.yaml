name: beta image

# Builds a testable image from every open release-please PR — the "would-be
# release" content — so a pending release can be canaried before it merges.
# Tags: `beta` (rolling), `<version>-beta` (from the release manifest) and
# `sha-<sha>` (exact). Beta builds skip SBOM/provenance; they are not release
# artifacts.
#
# `workflow_dispatch` allows ad-hoc beta builds of any ref (e.g. a feature
# branch under test).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: Branch, tag or SHA to build (defaults to this branch)

permissions:
  contents: read
  packages: write

concurrency:
  group: beta-image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prep:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release-please--')
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      arch_tag: ${{ steps.tags.outputs.arch_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          persist-credentials: false
      - name: Resolve beta tags
        id: tags
        env:
          HEAD_REF: ${{ github.head_ref || '' }}
        run: |
          short=$(git rev-parse --short=8 HEAD)
          echo "arch_tag=${IMAGE}:sha-${short}" >> "$GITHUB_OUTPUT"
          tags="beta sha-${short}"
          if [[ "$HEAD_REF" == release-please--* ]]; then
            ver=$(jq -r '.["."] // empty' .release-please-manifest.json)
            [[ -n "$ver" ]] && tags="${ver}-beta ${tags}"
          fi
          echo "beta tags: $tags"
          {
            echo "tags<<EOF"
            for t in $tags; do echo "${IMAGE}:${t}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.prep.outputs.arch_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=beta-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=beta-${{ matrix.arch }}

  merge:
    needs: [prep, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          ARCH_TAG: ${{ needs.prep.outputs.arch_tag }}
          TAGS: ${{ needs.prep.outputs.tags }}
        run: |
          args=()
          while IFS= read -r t; do
            [[ -n "$t" ]] && args+=(-t "$t")
          done <<< "$TAGS"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.event.repository.html_url }}" \
            "${args[@]}" \
            "$ARCH_TAG-amd64" \
            "$ARCH_TAG-arm64"

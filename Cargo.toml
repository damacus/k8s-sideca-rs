[package]
name = "k8s-sidecar-rs"
version = "0.2.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.2.0", features = ["runtime", "rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls-no-provider",
] }
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "json",
    "local-time",
] }
webpki-roots = "1.0.9"

[dev-dependencies]
axum = "0.8.9"
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio-stream = "0.1.19"
